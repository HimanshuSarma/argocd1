apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Use 'sources' (plural) to combine Helm repo and your Git repo
  sources:
    # Source 1: The public Helm Chart
    - repoURL: https://charts.helm.sh/stable
      chart: mysql
      targetRevision: 1.6.9
      helm:
        valueFiles:
          - $values/values.yaml # References the file from the repo below
    
    # Source 2: Your Git Repo (configuration)
    - repoURL: https://github.com/HimanshuSarma/argocd1.git
      targetRevision: HEAD
      ref: values # This 'ref' creates the '$values' variable used above
      path: k8s-infra/platform-stack/mysql
      
  destination:
    server: https://kubernetes.default.svc
    namespace: mysql # Recommended: deploy into its own namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true