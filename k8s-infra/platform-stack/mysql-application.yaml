apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Use 'sources' (plural) to combine Helm repo and your Git repo
  sources:
    - repoURL: https://charts.helm.sh/stable
      chart: mysql
      targetRevision: 1.6.9
      helm:
        valueFiles:
          # If 'resources' is the root, just point to the folder inside it
          - $values/helm-config/values.yaml 
    
    - repoURL: https://github.com/HimanshuSarma/argocd1.git
      targetRevision: HEAD
      ref: values
      path: k8s-infra/platform-stack/mysql/resources
      
  destination:
    server: https://kubernetes.default.svc
    namespace: mysql # Recommended: deploy into its own namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true