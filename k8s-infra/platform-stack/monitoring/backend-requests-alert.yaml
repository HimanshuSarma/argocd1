apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-request-alerts
  namespace: monitoring
  labels:
    # This matching label ensures the operator discovers the rule
    release: monitoring-stack
spec:
  groups:
  - name: BackendTrafficAlerts
    rules:
    - alert: HighRequestRate
      expr: rate(http_requests_total[1m]) * 60 > 10
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "High request rate on backend"
        description: "Backend service is receiving {{ $value }} requests per minute."