apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd1-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    # This captures the second part of the regex to pass to the service
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      # 1. Producer: Added (/|$)(.*)
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-svc
            port:
              number: 8000