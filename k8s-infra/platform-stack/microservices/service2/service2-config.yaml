apiVersion: apps/v1
kind: Deployment
metadata:
  name: service2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service2
  template:
    metadata:
      labels:
        app: service2
    spec:
      containers:
      - name: service2
        image: index.docker.io/himanshusarma123/service2:v1
---
apiVersion: v1
kind: Service
metadata:
  name: service2-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: service2
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---