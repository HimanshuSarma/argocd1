apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    environment: dev
    team: engineering
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: index.docker.io/himanshusarma123/auth:v1
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000