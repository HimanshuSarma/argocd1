apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: index.docker.io/himanshusarma123/auth:v1
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: 30001
      targetPort: 8000