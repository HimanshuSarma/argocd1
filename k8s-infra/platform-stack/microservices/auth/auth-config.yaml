apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: "25%"
  template:
    metadata:
      labels:
        app: auth
      annotations:
        # This tells Prometheus to scrape this pod
        prometheus.io/scrape: "true"
        # The port your application code exposes the /metrics endpoint on
        prometheus.io/port: "8000" 
        # The path where your app serves metrics
        prometheus.io/path: "/metrics"
    spec:
      shareProcessNamespace: true
      containers:
      - name: auth
        image: index.docker.io/himanshusarma123/auth:v11
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"  # The container will immediately get terminated if it crosses this
            cpu: "200m"

        livenessProbe:
          httpGet:
            path: /       # A lightweight endpoint to see if the process is responsive
            port: 8000
          initialDelaySeconds: 5  # Give the app 5 seconds to boot up before checking
          periodSeconds: 10       # Check every 10 seconds

        readinessProbe:
          httpGet:
            path: /healthz/readiness # Hit an endpoint that confirms your internal dependencies/RBAC work
            port: 8000
          initialDelaySeconds: 5  # Start checking 5 seconds after boot
          periodSeconds: 10       # Check every 10 seconds
          failureThreshold: 5
      - name: terminal-clearer-sidecar
        image: alpine:latest
        # This loops every 5 seconds, sends the clear screen ANSI codes directly to standard out of process 1 (the main node/express app)
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            echo "Sidecar executing terminal wipe..."
            # In a shared namespace, we can broadcast a clear command or interact with stdout if TTY is open, 
            # or simply log a giant wall of empty space to clear the scrolling buffer!
            printf "\033c" > /proc/1/fd/1 2>/dev/null || true
            echo "\n\n\n=== TERMINAL CLEARED BY SIDECAR ===\n\n\n" > /proc/1/fd/1 2>/dev/null || true
            sleep 5
          done
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service-monitor
  namespace: default          # Keep it in the same namespace as your app
  labels:
    # CRITICAL: This label MUST match the release name of your prometheus stack
    release: monitoring-stack
spec:
  selector:
    matchLabels:
      app: auth
  endpoints:
  - port: http                
    path: /metrics            
    interval: 10s             
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: default
  labels:
    app: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---