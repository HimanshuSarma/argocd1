apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Using Bitnami's official HTTPS Helm registry repository
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    # Pins to a stable version of the chart (adjust as needed)
    targetRevision: 16.4.1
    helm:
      values: |
        # Bitnami's equivalent to your MySQL credentials setup
        auth:
          postgresPassword: "rootpassword"
          database: "mydb"
          username: "myuser"
          password: "mypassword"
        
        # Disabled persistence for match-for-match testing parity
        primary:
          persistence:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true